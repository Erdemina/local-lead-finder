<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{business_name}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #111; background: #fff;
         line-height: 1.8; }
  main { max-width: 640px; margin: 0 auto; padding: 96px 24px; }
  h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.02em; }
  .category { color: #666; margin-top: 4px; font-size: 1.05rem; }
  hr { border: none; border-top: 1px solid #e5e5e5; margin: 40px 0; }
  p { color: #333; }
  .contact { margin-top: 32px; }
  .contact a { color: #111; font-weight: 600; text-decoration: underline; }
  .contact p { margin: 4px 0; }
  footer { color: #999; font-size: 0.85rem; margin-top: 80px; }
</style>
</head>
<body>
<main>
  <h1>{{business_name}}</h1>
  {{#if category}}<p class="category">{{category}}</p>{{/if}}
  <hr>
  {{#if about}}<p>{{about}}</p>{{/if}}
  <p>Kaliteli hizmet, dürüst fiyat. İhtiyacınız için bize ulaşın.</p>
  <div class="contact">
    {{#if phone}}<p>Telefon: <a href="tel:{{phone_href}}">{{phone}}</a></p>{{/if}}
    {{#if address}}<p>Adres: {{address}}</p>{{/if}}
  </div>
  <footer>© {{year}} {{business_name}}</footer>
</main>
</body>
</html>
